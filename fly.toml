# fly.toml app configuration file generated for thorchain on 2026-08-16T02:06:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thorchain'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
